<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Funcionário</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Sistema RH</h1>
                <ul class="nav-links">
                    <li><a th:href="@{/index/homepage}">Home</a></li>
                    <li><a th:href="@{/index/exibirTodosFuncionarios}">Exibir Funcionários</a></li>
                    <li><a th:href="@{/trabalhos}">Exibir Trabalhos</a></li>
                    <li><a th:href="@{/index/adicionarFuncionario}">Adicionar Funcionário</a></li>
                    <li><a th:href="@{/trabalhos/novo}">Adicionar Trabalho</a></li>
                </ul>
          </div>
    </nav>

    <main class="form-container">
        <h2>Cadastrar Funcionário</h2>

            <div th:if="${mensagem}" th:text="${mensagem}"></div>
            <form th:action="@{/index/salvar}" th:object="${funcionario}" method="post" class="form-box">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" th:fiel="*{nome}" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="0" th:fiel="*{idade}" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" th:fiel="*{email}" required>

                <button type="submit">Cadastrar Funcionário</button>
            </form>
    </main>

</body>
</html>
